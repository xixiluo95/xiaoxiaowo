<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<style>
  .wrap { padding: 0 16px; }
  .cal-card { margin-top: 12px; padding: 14px 12px 10px; }
  .month { text-align: center; font-size: 13px; font-weight: 600; margin-bottom: 10px; letter-spacing: 2px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px 4px; }
  .wd { text-align: center; font-size: 10px; color: var(--ink-soft); padding-bottom: 3px; }
  .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
          border-radius: 10px; font-size: 12px; position: relative; }
  .cell.white { border: 1.5px solid var(--calm-stroke); background: #fff; color: var(--ink-soft); }
  .cell.emo { color: #fff; font-weight: 600; text-shadow: 0 1px 2px rgba(91,74,63,.35); }
  .cell.dual { background: linear-gradient(135deg, var(--joy) 0%, var(--joy) 45%, var(--sadness) 55%, var(--sadness) 100%); }
  .cell.today { border: 1.5px dashed var(--ink); background: #fff; color: var(--ink); font-weight: 700; }
  .cell.future { color: #C9C0B2; }
  .cell.selected { outline: 2.5px solid var(--anger); outline-offset: 1px; border-radius: 12px; }
  .detail { margin-top: 12px; padding: 13px 14px; }
  .d-head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .d-dot { width: 12px; height: 12px; border-radius: 5px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 11.5px; color: #6E5F54; }
  .bar-row .lb { width: 34px; }
  .bar-track { flex: 1; height: 12px; background: var(--calm); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px 3px 3px 6px; transform: rotate(-0.4deg); }
  .bar-row .pc { width: 34px; text-align: right; }
  .diary-entry { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 12px;
                 background: var(--bg); border-radius: 12px; font-size: 12.5px; font-weight: 600; }
  .diary-entry .arr { margin-left: auto; color: #C9C0B2; font-size: 16px; }
  .pending { margin-top: 12px; padding: 11px 14px; display: flex; align-items: center; gap: 10px; }
  .pending canvas { width: 26px; height: 26px; }
  .pending .pt { font-size: 12.5px; } .pending .pt b { font-weight: 600; }
  .pending .pt small { display: block; font-size: 11px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="page-title">心情日历</div>
  <div class="page-sub">家长视角 · 2026 年 10 月</div>
  <div class="wrap">
    <div class="r-card cal-card">
      <div class="month">2026 年 10 月</div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="r-card detail">
      <div class="d-head"><span class="d-dot" style="background:var(--anger)"></span>10月10日 · 主要情绪：生气</div>
      <div class="bar-row"><span class="lb">生气</span><div class="bar-track"><div class="bar-fill" style="width:55%;background:var(--anger)"></div></div><span class="pc">55%</span></div>
      <div class="bar-row"><span class="lb">难过</span><div class="bar-track"><div class="bar-fill" style="width:45%;background:var(--sadness)"></div></div><span class="pc">45%</span></div>
      <div class="diary-entry">查看孩子分享的日记<span class="arr">›</span></div>
    </div>
    <div class="r-card pending">
      <canvas data-heart="#FFFFFF" data-stroke="#D8D2C4" data-seed="55" data-strokewidth="2" width="56" height="56"></canvas>
      <div class="pt"><b>10月11日（今天）· 待确认</b><small>孩子还没有确认今天的心情</small></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
  <script src="shared.js"></script>
  <script>
    const EMOS = { anger: 'var(--anger)', sadness: 'var(--sadness)', fear: 'var(--fear)', joy: 'var(--joy)' };
    const MAP = { 1:'joy', 2:'joy', 3:'sadness', 4:'fear', 5:'joy', 6:'anger', 7:'dual', 8:'joy', 9:'sadness', 10:'anger' };
    const TODAY = 11, SELECTED = 10;
    const grid = document.getElementById('grid');
    ['一','二','三','四','五','六','日'].forEach(w => {
      const el = document.createElement('div'); el.className = 'wd'; el.textContent = w; grid.appendChild(el);
    });
    const offset = (new Date(2026, 9, 1).getDay() + 6) % 7;
    for (let i = 0; i < offset; i++) grid.appendChild(document.createElement('div'));
    for (let d = 1; d <= 31; d++) {
      const c = document.createElement('div');
      c.className = 'cell';
      if (d === TODAY) c.classList.add('today');
      else if (MAP[d] === 'dual') c.classList.add('emo', 'dual');
      else if (MAP[d]) { c.classList.add('emo'); c.style.background = EMOS[MAP[d]]; }
      else { c.classList.add('white'); if (d > TODAY) c.classList.add('future'); }
      if (d === SELECTED) c.classList.add('selected');
      c.textContent = d;
      grid.appendChild(c);
    }
    renderRough();
  </script>
</body>
</html>
