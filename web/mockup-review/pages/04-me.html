<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<style>
  .header { display: flex; flex-direction: column; align-items: center; padding-top: 40px; }
  .avatar { width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle, #FFF8E7, #F2EEE6);
            border: 2px solid var(--calm-stroke); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .avatar img { height: 118px; margin-bottom: -30px; }
  .header h1 { font-size: 20px; margin-top: 12px; letter-spacing: 2px; }
  .header p { font-size: 12px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 1px; }
  .list { padding: 26px 16px 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 15px 14px; margin-bottom: 12px; }
  .row .ic { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
             font-size: 16px; flex-shrink: 0; }
  .row .txt { flex: 1; }
  .row .txt b { font-size: 15px; font-weight: 600; display: block; }
  .row .txt small { font-size: 11px; color: var(--ink-soft); }
  .row .arr { color: #C9C0B2; font-size: 18px; }
  .badge { font-size: 10px; color: var(--joy); background: #FFF6DE; border: 1px solid var(--joy);
           border-radius: 999px; padding: 1px 8px; }
</style>
</head>
<body>
  <div class="header">
    <div class="avatar"><img src="/assets/emotions/calm/idle.png" alt="云朵小头像"></div>
    <h1>我的小天地</h1>
    <p>朵朵的小世界</p>
  </div>
  <div class="list">
    <div class="r-card row">
      <div class="ic" style="background:#FFF6DE"><canvas data-icon="calendar" width="44" height="44" style="width:22px;height:22px"></canvas></div>
      <div class="txt"><b>我的心情日历</b><small>看看每天的心情颜色</small></div>
      <span class="arr">›</span>
    </div>
    <div class="r-card row">
      <div class="ic" style="background:#EDF4FD"><canvas data-icon="book" width="44" height="44" style="width:22px;height:22px"></canvas></div>
      <div class="txt"><b>今天的小日记</b><small>记录今天发生的事</small></div>
      <span class="arr">›</span>
    </div>
    <div class="r-card row">
      <div class="ic" style="background:#FDEEE9"><canvas data-heart="#FFC94D" data-stroke="#5B4A3F" data-seed="5" width="44" height="44" style="width:22px;height:22px"></canvas></div>
      <div class="txt"><b>绑定的大人</b><small>妈妈 · 已绑定</small></div>
      <span class="badge">演示绑定</span>
      <span class="arr">›</span>
    </div>
    <div class="r-card row">
      <div class="ic" style="background:#F2EEE6; font-size:15px; color:var(--ink-soft)">?</div>
      <div class="txt"><b>关于小小我</b><small>版本与我们的小心思</small></div>
      <span class="arr">›</span>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
  <script src="shared.js"></script>
  <script>renderRough();</script>
</body>
</html>
